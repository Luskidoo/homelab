apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app: radarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
      - name: radarr
        image: "linuxserver/radarr:latest"
        ports:
          - containerPort: 7878
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: "UTC"
        volumeMounts:
          - name: config
            mountPath: /config
          - name: data
            mountPath: /data
      initContainers:
      - name: create-directories
        image: "busybox:latest"
        command: ["sh", "-c", "mkdir -p /data/media && mkdir -p /data/media/films && chown -R 1000:1000 /config /data"]
        volumeMounts:
          - name: config
            mountPath: /config
          - name: data
            mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: media-pvc