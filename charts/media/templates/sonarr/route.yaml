apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-web-route
spec:
  parentRefs:
  - name: main-gateway
    namespace: security
  hostnames:
  - "sonarr.alstrom.home.arpa"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sonarr
      port: 8989