apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: "linuxserver/sonarr:latest"
        ports:
          - containerPort: 8989
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: "UTC"
        volumeMounts:
          - name: config
            mountPath: /config
          - name: data
            mountPath: /data
      initContainers:
      - name: create-directories
        image: "busybox:latest"
        command: ["sh", "-c", "mkdir /data/media/tv && chown -R 1000:1000 /config /data/media/tv"]
        volumeMounts:
          - name: config
            mountPath: /config
          - name: data
            mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: media-pvc