apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: p2p
      port: 6881
      targetPort: p2p
      protocol: TCP
    - name: p2pudp
      port: 6881
      targetPort: p2p
      protocol: UDP
  selector:
    app: qbittorrent