apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-web-route
spec:
  parentRefs:
  - name: main-gateway
    namespace: security
  hostnames:
  - "longhorn.alstrom.home.arpa"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: longhorn-frontend
      port: 80